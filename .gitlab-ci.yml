image:
  name: gcr.io/kaniko-project/executor:v1.14.0-debug
  entrypoint: [""]

stages:
  - build-push
  - deploy

build_and_push:
  stage: build-push
  only:
    - main
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${DOCKERHUB_USERNAME}/nails-frontend:latest"
      --destination "${DOCKERHUB_USERNAME}/nails-frontend:${CI_COMMIT_SHA}"
      --build-arg "VITE_BASE_URL=${VITE_BASE_URL}"
      --build-arg "VITE_YOUTUBE_API_KEY=${VITE_YOUTUBE_API_KEY}"
      --build-arg "VITE_IMG_URL=${VITE_IMG_URL}"
      --build-arg "IMG_URL=${IMG_URL}"
      --cache=false
      --compressed-caching=false

deploy_to_server:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $SERVER_USER@$SERVER_IP "cd $SERVER_DEPLOY_PATH && docker compose pull nails-frontend"
    - ssh $SERVER_USER@$SERVER_IP "cd $SERVER_DEPLOY_PATH && docker compose up -d --no-deps nails-frontend"
    - ssh $SERVER_USER@$SERVER_IP "docker image prune -f"

